---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Label Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .forgejo/labels.yaml
      - .forgejo/scripts/label-sync.sh
      # schedule:
      #   - cron: 0 0 * * *

jobs:
  main:
    name: Label Sync - Sync Labels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .forgejo

      - name: Sync Labels
        env:
          FORGEJO_API_URL: ${{ forgejo.api_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          FORGEJO_TOKEN: ${{ secrets.MISTGAZER_TOKEN }}
        run: bash .forgejo/scripts/label-sync.sh .forgejo/labels.yaml
