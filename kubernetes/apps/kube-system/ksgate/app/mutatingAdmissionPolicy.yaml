---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: ksgate-scheduling-gates
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: has-ksgate-annotations
      expression: >-
        has(object.metadata.annotations) &&
        object.metadata.annotations.exists(k, k.startsWith("k8s.ksgate.org/"))
  failurePolicy: Ignore
  reinvocationPolicy: Never
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              schedulingGates: object.metadata.annotations
                .filter(k, k.startsWith("k8s.ksgate.org/"))
                .map(k, Object.spec.schedulingGates{name: k})
            }
          }
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: ksgate-scheduling-gates
spec:
  policyName: ksgate-scheduling-gates
