---
# yaml-language-server: $schema=https://schemas.mortebrume.eu/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: enabled
spec:
  instances: 2

  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:1abcfd1cac6d53cda5185706819aab36d66a4ed88e99fc2ae44ab0826aa99f00

  primaryUpdateMethod: switchover

  certificates:
    serverTLSSecret: postgres-server-cert
    serverCASecret: postgres-server-cert
    clientCASecret: postgres-client-ca
    replicationTLSSecret: postgres-replication-cert

  storage:
    size: 15Gi
    storageClass: zfs-pv-db

  bootstrap:
    recovery:
      source: &src source

  plugins:
    - name: &plugin barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: &store r2-store

  externalClusters:
    - name: *src
      plugin:
        name: *plugin
        parameters:
          barmanObjectName: *store
          serverName: postgres

  monitoring:
    enablePodMonitor: true

  postgresql:
    pg_hba:
      - hostssl all all all cert clientcert=verify-full map=pooler-map
    pg_ident:
      - pooler-map pooler-rw all
    shared_preload_libraries:
      - "timescaledb"
    parameters:
      timescaledb.telemetry_level: "off"
      max_locks_per_transaction: "128"

    extensions:
      - name: timescaledb
        image:
          reference: registry.mortebrume.eu/timescaledb:2.29.2-pg18@sha256:4400d3377014e00b707e584b79f1c3f612a059c64ed7788434368fdd97edb65e

  managed:
    roles:
      - name: grafana-read
        ensure: present
        login: true
        superuser: false
        disablePassword: true

      - name: pooler-rw
        ensure: present
        login: true
        superuser: false
        disablePassword: true
