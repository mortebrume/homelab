---
# yaml-language-server: $schema=https://schemas.mortebrume.eu/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres-cluster
spec:
  dependsOn:
    - name: cnpg
      namespace: cnpg-system
    - name: plugin-barman-cloud
      namespace: cnpg-system
    - name: openebs
      namespace: openebs-system
    - name: cert-manager
      namespace: security
    - name: trust-manager-config
      namespace: security
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
  interval: 1h
  path: ./kubernetes/apps/database/postgres/cluster
  postBuild:
    substituteFrom:
      - kind: Secret
        name: barman-r2
        optional: true
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
