---
# yaml-language-server: $schema=https://schemas.mortebrume.eu/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  chartRef:
    kind: OCIRepository
    name: flux-operator
  interval: 1h
  values:
    resources:
      requests:
        cpu: 10m
        memory: 320Mi
      limits:
        cpu: 2000m
        memory: 1Gi
    serviceMonitor:
      create: true
    web:
      networkPolicy:
        create: false
