---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mautrix-irc
spec:
  chartRef:
    kind: OCIRepository
    name: mautrix-irc
  interval: 1h
  values:
    controllers:
      mautrix-irc:
        annotations:
          reloader.stakater.com/auto: "true"
        type: statefulset # Following dev's guideline
        containers:
          app:
            image:
              repository: dock.mau.dev/mautrix/irc
              # No tagged version yet
              tag: latest@sha256:415e9908b1302aae50c0f3f1f9ddd9eba99d1451bb0bd6eaaa4f0da2cd2300a2
            command:
              - "/usr/bin/mautrix-irc"
            args:
              - "-c"
              - "/config/config.yaml"
              - "--no-update"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /_matrix/mau/live
                    port: &port 8000
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness:
                <<: *probes
                spec:
                  httpGet:
                    path: /_matrix/mau/ready
                    port: *port
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 500Mi
    defaultPodOptions:
      annotations:
        k8s.ksgate.org/continuwuity-ready: |
          {
            "apiVersion": "apps/v1",
            "kind": "StatefulSet",
            "name": "continuwuity",
            "namespace": "matrix",
            "expression": "has(resource.status.readyReplicas) && resource.status.readyReplicas >= 1"
          }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        publishNotReadyAddresses: true
        ports:
          http:
            port: 80
            targetPort: *port
    route:
      app:
        hostnames:
          - mautrix-irc.mortebrume.eu
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 80
    persistence:
      config:
        type: secret
        name: mautrix-irc
        globalMounts:
          - path: /config/config.yaml
            subPath: config.yaml
      tmp:
        type: emptyDir
