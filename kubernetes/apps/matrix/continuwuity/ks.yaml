---
# yaml-language-server: $schema=https://schemas.mortebrume.eu/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: continuwuity
spec:
  components:
    - ../../../../components/kopiur
    - ../../../../components/oidc
  interval: 1h
  path: ./kubernetes/apps/matrix/continuwuity/app
  postBuild:
    substitute:
      APP: continuwuity
      KOPIUR_CAPACITY: 10Gi
      KOPIUR_STORAGECLASS: zfs-pv-db
      NAMESPACE: matrix
      OIDC_CALLBACK: /_continuwuity/oidc/complete
      OIDC_DISPLAY_NAME: Continuwuity
      SUBDOMAIN: matrix
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: matrix
