---
# yaml-language-server: $schema=https://schemas.mortebrume.eu/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-operator
spec:
  interval: 1h
  path: ./kubernetes/apps/observability/grafana/operator
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
---
# yaml-language-server: $schema=https://schemas.mortebrume.eu/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana
spec:
  components:
    - ../../../../components/oidc
  dependsOn:
    - name: grafana-operator
      namespace: observability
    - name: openebs
      namespace: openebs-system
  healthCheckExprs:
    - apiVersion: grafana.integreatly.org/v1beta1
      kind: Grafana
      current: status.conditions.exists(e, e.type == 'GrafanaReady' && e.status == 'True')
  interval: 1h
  path: ./kubernetes/apps/observability/grafana/instance
  postBuild:
    substitute:
      APP: grafana
      NAMESPACE: observability
      OIDC_CALLBACK: /login/generic_oauth
      OIDC_DISPLAY_NAME: Grafana
      OIDC_GROUP: admins
      OIDC_CLAIM_MAPS: |
        {
          "grafana_role": {
            "joinType": "array",
            "valuesByGroup": {
              "admins@idm.mortebrume.eu": ["GrafanaAdmin"]
            }
          }
        }
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
