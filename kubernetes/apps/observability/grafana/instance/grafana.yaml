---
# yaml-language-server: $schema=https://schemas.mortebrume.eu/grafana.integreatly.org/grafana_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    grafana.internal/instance: grafana
spec:
  config:
    analytics:
      check_for_updates: "false"
      check_for_plugin_updates: "false"
      feedback_links_enabled: "false"
      reporting_enabled: "false"
    auth:
      disable_login_form: "true"
    auth.anonymous:
      enabled: "false"
    auth.generic_oauth:
      enabled: "true"
      name: Kanidm
      client_id: grafana
      api_url: https://idm.mortebrume.eu/oauth2/openid/grafana/userinfo
      auth_url: https://idm.mortebrume.eu/ui/oauth2
      token_url: https://idm.mortebrume.eu/oauth2/token
      allow_assign_grafana_admin: "true"
      allow_sign_up: "true"
      use_pkce: "true"
      use_refresh_token: "true"
      scopes: openid email profile groups
      login_attribute_path: preferred_username
      groups_attribute_path: groups
      role_attribute_path: contains(grafana_role[*], 'GrafanaAdmin') && 'GrafanaAdmin' || 'Viewer'
    log:
      mode: console
    metrics:
      enabled: "true"
    news:
      news_feed_enabled: "false"
    plugins:
      plugin_admin_enabled: "false"
      disable_plugins: "grafana-lokiexplore-app,grafana-metricsdrilldown-app,grafana-pyroscope-app,grafana-exploretraces-app,loki"
    security:
      angular_support_enabled: "true"
    server:
      enable_gzip: "true"
      root_url: https://grafana.mortebrume.eu
    unified_alerting:
      enabled: "false"
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          containers:
            - name: grafana
              env:
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: kanidm-grafana-oidc
                      key: client-secret
                - name: GF_INSTALL_PLUGINS_FORCE
                  value: "true"
                - name: GF_DATE_FORMATS_USE_BROWSER_LOCALE
                  value: "true"
                - name: GF_SECURITY_COOKIE_SAMESITE
                  value: grafana
              envFrom:
                - secretRef:
                    name: grafana
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              volumeMounts:
                - name: postgres-certs
                  mountPath: /var/run/secrets/postgresql
                - name: root-ca
                  mountPath: /var/run/secrets/root-ca
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
            - name: postgres-certs
              csi:
                driver: csi.cert-manager.io
                readOnly: true
                volumeAttributes:
                  csi.cert-manager.io/issuer-name: postgres-client-ca
                  csi.cert-manager.io/issuer-kind: ClusterIssuer
                  csi.cert-manager.io/key-algorithm: ECDSA
                  csi.cert-manager.io/key-size: "384"
                  csi.cert-manager.io/key-encoding: PKCS8
                  csi.cert-manager.io/key-usages: client auth
                  csi.cert-manager.io/common-name: grafana-read
                  csi.cert-manager.io/dns-names: $${POD_NAME}.$${POD_NAMESPACE}.svc.cluster.local
            - name: root-ca
              secret:
                defaultMode: 0440
                secretName: root-ca
  httpRoute:
    spec:
      hostnames:
        - grafana.mortebrume.eu
      parentRefs:
        - name: envoy-internal
          namespace: network
      rules:
        - backendRefs:
            - name: grafana-service
              port: 3000
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      storageClassName: zfs-pv
  disableDefaultSecurityContext: All
