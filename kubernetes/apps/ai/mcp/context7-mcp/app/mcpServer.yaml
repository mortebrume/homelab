---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: context7
spec:
  image: ghcr.io/stacklok/dockyard/npx/context7:4.7.3
  transport: stdio
  proxyPort: 8080
  groupRef:
    name: mcp-tools
  secrets:
    - name: context7-api-key
      key: token
      targetEnvName: CONTEXT7_API_KEY
