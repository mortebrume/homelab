---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcptoolconfig_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: victoria-logs
spec:
  toolsOverride:
    query:
      description: >-
        Run a LogsQL query against VictoriaLogs. Do filtering, aggregation,
        sorting and field projection IN the query with pipes — do not fetch raw
        logs and post-process them. Pipes: `| stats by (field) count() as c`,
        `| fields _time, msg`, `| sort by (_time)`, `| limit N`, `| uniq by (x)`,
        `| top N by (field)`. Stream fields are `kubernetes.pod_namespace`,
        `kubernetes.pod_name`, `kubernetes.container_name`, e.g.
        `{kubernetes.pod_namespace="ns"}`; pod labels are under
        `kubernetes.pod_labels.*`. Logs older than 2026-11-20 use
        `k_namespace_name`, `k_pod_name`, `k_container_name` instead. Stream
        selectors plus bareword / "phrase" / regex filters narrow before
        aggregation. If a result is large, add `| stats`/filters rather than
        paginating raw output.
    stats_query:
      description: >-
        Instant LogsQL stats query (single point in time). Use `| stats`
        aggregations — count(), sum(), avg(), quantile(), uniq() — grouped
        `by (field)`. Prefer this over querying raw logs and counting client-side.
        The `time` argument is required despite the schema: pass the current
        time in RFC3339.
    stats_query_range:
      description: >-
        Range LogsQL stats query returning a time series of `| stats`
        aggregations across [start, end] at a step. For trends/rates over time.
