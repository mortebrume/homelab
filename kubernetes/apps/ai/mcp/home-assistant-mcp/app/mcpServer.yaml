---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: ha-mcp
spec:
  image: ghcr.io/homeassistant-ai/ha-mcp:9.2.0
  transport: streamable-http
  mcpPort: 8086
  proxyPort: 8080
  args:
    - ha-mcp-web
  groupRef:
    name: mcp-tools
  env:
    - name: HOMEASSISTANT_URL
      value: http://home-assistant.automation.svc.cluster.local:8123
    - name: MCP_PORT
      value: "8086"
    - name: MCP_SECRET_PATH
      value: /mcp
    - name: HA_MCP_DISABLE_SETTINGS_UI
      value: "true"
  secrets:
    - name: home-assistant-mcp
      key: token
      targetEnvName: HOMEASSISTANT_TOKEN
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /home/mcpuser/.ha-mcp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
