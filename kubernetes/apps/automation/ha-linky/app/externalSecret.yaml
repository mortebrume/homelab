---
# yaml-language-server: $schema=https://schemas.mortebrume.eu/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ha-linky
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        SUPERVISOR_TOKEN: "{{ .HASS_TOKEN }}"
      templateFrom:
        - configMap:
            name: ha-linky-configmap
            items:
              - key: options.json
  dataFrom:
    - extract:
        key: ha-linky
