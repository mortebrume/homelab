---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ha-linky
spec:
  chartRef:
    kind: OCIRepository
    name: ha-linky
  interval: 1h
  values:
    controllers:
      ha-linky:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: registry.mortebrume.eu/ha-linky
              tag: 1.9.0-e106dfc@sha256:8778e2834244289800421cbe4475c7a8006b59b9ba232e7f31bdadc391bb9753
            env:
              TZ: Europe/Paris
              WS_URL: ws://home-assistant.automation.svc:8123/api/websocket
              SUPERVISOR_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: ha-linky
                    key: SUPERVISOR_TOKEN
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      data:
        type: secret
        name: ha-linky
        globalMounts:
          - path: /data/options.json
            subPath: options.json
