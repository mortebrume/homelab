---
# yaml-language-server: $schema=https://schemas.mortebrume.eu/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant
spec:
  components:
    - ../../../../components/kopiur
    - ../../../../components/oidc
  interval: 1h
  path: ./kubernetes/apps/automation/home-assistant/app
  postBuild:
    substitute:
      APP: home-assistant
      KOPIUR_CAPACITY: 10Gi
      NAMESPACE: automation
      OIDC_CALLBACK: /auth/openid/callback
      OIDC_DISPLAY_NAME: Home Assistant
      OIDC_SHORT_USERNAME: "true"
      SUBDOMAIN: home
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: automation
