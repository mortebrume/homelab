---
# Loads default set of integrations. Do not remove.
default_config:

recorder:
  db_url: !env_var HASS_RECORDER_DB_URL

logger:
  default: warning
  logs:
    custom_components.auth_oidc: info

prometheus:
  namespace: hass
  requires_auth: false
  component_config_glob:
    sensor.*_temp:
      override_metric: temperature_c
    sensor.temperature*:
      override_metric: temperature_c
    sensor.*_bat:
      override_metric: battery_percent
  filter:
    include_domains:
      - sensor
    exclude_entity_globs:
      - sensor.weather_*
      - sensor.sun_*

auth_oidc:
  client_id: home-assistant
  client_secret: !env_var HASS_OPENID_CLIENT_SECRET
  discovery_url: "https://idm.mortebrume.eu/oauth2/openid/home-assistant/.well-known/openid-configuration"
  features:
    automatic_person_creation: true
    automatic_user_linking: true
  id_token_signing_alg: "ES256"
  roles:
    admin: "admins@idm.mortebrume.eu"
    user: "users@idm.mortebrume.eu"

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
