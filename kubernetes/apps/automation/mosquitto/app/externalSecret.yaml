---
# yaml-language-server: $schema=https://schemas.mortebrume.eu/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mosquitto
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        mosquitto_pwd: |
          home-assistant:{{ .HASS_PASSWORD }}
          smhub:{{ .SMHUB_PASSWORD }}
  dataFrom:
    - extract:
        key: mosquitto
