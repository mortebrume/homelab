---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
spec:
  chartRef:
    kind: OCIRepository
    name: mosquitto
  interval: 1h
  values:
    controllers:
      mosquitto:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          pwd:
            image:
              repository: docker.io/library/eclipse-mosquitto
              tag: 2.1.2-alpine@sha256:75d6662dee52c947dc9dd9c29f1d8d7ffef78ddaf38001caa09755681e8bbc98
            command:
              - "bin/sh"
              - "-c"
            args:
              - install -m 0600 /secret/mosquitto_pwd /mosquitto/external_config/mosquitto_pwd && mosquitto_passwd -U /mosquitto/external_config/mosquitto_pwd
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
        containers:
          app:
            image:
              repository: docker.io/library/eclipse-mosquitto
              tag: 2.1.2-alpine@sha256:75d6662dee52c947dc9dd9c29f1d8d7ffef78ddaf38001caa09755681e8bbc98
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 5m
              limits:
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        type: ClusterIP
        internalTrafficPolicy: Cluster
        ipFamilyPolicy: PreferDualStack
        externalIPs:
          - 100.115.152.117
          - fd7a:115c:a1e0::b901:9883
        ports:
          mqtt:
            port: 1883
    persistence:
      config:
        type: configMap
        name: mosquitto-config
        globalMounts:
          - path: /mosquitto/config/mosquitto.conf
            subPath: mosquitto.conf
      data:
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /data
      secret:
        type: secret
        name: mosquitto
        advancedMounts:
          mosquitto:
            pwd:
              - path: /secret
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /mosquitto/external_config
            subPath: external_config
          - path: /tmp
            subPath: tmp
