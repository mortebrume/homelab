---
# yaml-language-server: $schema=https://schemas.mortebrume.eu/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bazarr
spec:
  components:
    - ../../../../components/kopiur
    - ../../../../components/oidc/envoy
    - ../../../../components/postgres/cert
  dependsOn:
    - name: openebs
      namespace: openebs-system
  interval: 1h
  path: ./kubernetes/apps/media/bazarr/app
  postBuild:
    substitute:
      APP: bazarr
      KOPIUR_CAPACITY: 1Gi
      NAMESPACE: media
      OIDC_DISPLAY_NAME: Bazarr
      OIDC_GROUP: admins
      OIDC_SCOPES: '["openid", "profile"]'
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
