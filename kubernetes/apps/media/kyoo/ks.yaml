---
# yaml-language-server: $schema=https://schemas.mortebrume.eu/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyoo
spec:
  components:
    - ../../../../components/oidc
    - ../../../../components/postgres/cert
  interval: 1h
  path: ./kubernetes/apps/media/kyoo/app
  postBuild:
    substitute:
      APP: kyoo
      DATABASE_EXTENSIONS: '[{"name":"pg_trgm","schema":"kyoo"}]'
      DATABASE_SCHEMAS: '[{"name":"kyoo","owner":"kyoo"},{"name":"keibi","owner":"kyoo"},{"name":"scanner","owner":"kyoo"},{"name":"gocoder","owner":"kyoo"}]'
      NAMESPACE: media
      OIDC_CALLBACK: /auth/oidc/logged/kanidm
      OIDC_DISABLE_PKCE: "true"
      OIDC_DISPLAY_NAME: Kyoo
      OIDC_SCOPES: '["openid", "profile", "email"]'
      OIDC_SHORT_USERNAME: "true"
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
