---
# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/master/schemas/config-schema.json
sonarr:
  sonarr:
    base_url: http://sonarr.media.svc.cluster.local:8989
    api_key: !env_var SONARR_API_KEY

    delete_old_custom_formats: true

    media_management:
      propers_and_repacks: do_not_prefer

    media_naming:
      series: jellyfin-tvdb
      season: default
      episodes:
        rename: false
        standard: default
        daily: default
        anime: default

    quality_definition:
      type: series

    quality_profiles:
      - trash_id: &web c4cadd6b35b95f62c3d47a408e53e2f7 # WEB-2160p (Combined)
        reset_unmatched_scores:
          enabled: true
      - trash_id: &anime 20e0fc959f1f1704bed501f23bdae76f # [Anime] Remux-1080p
        quality_definition: # per-profile sizes (Sonarr v5)
          type: anime
        reset_unmatched_scores:
          enabled: true

    # default groups (HDR, Golden Rule UHD, Unwanted, Streaming, ...) are synced implicitly
    custom_format_groups:
      add:
        - trash_id: 59c3af66780d08332fdc64e68297098f # [Unwanted] Unwanted Formats
          select:
            - 82d40da2bc6923f41e14394075dd4b03 # No-RlsGroup
            - e1a997ddb54e3ecbfe06341ad323c458 # Obfuscated
            - 06d66ab109d4d2eddb2794d21526d140 # Retags
        - trash_id: d776a1ea912a117d66d83b880ff2055d # [HDR Formats] DV (w/o HDR fallback)

    custom_formats:
      - trash_ids: # only do a minor penalty, instead of the default major one
          - 9b64dff695c2115facf1b6ea59c9bd07 # x265 (no HDR/DV)
        assign_scores_to:
          - trash_id: *web
            score: -100

      - trash_ids: # only do a minor penalty, instead of the default major one
          - 15a05bc7c1a36e2b57fd628f8977e2fc # AV1
        score: -200
        assign_scores_to:
          - trash_id: *web
          - trash_id: *anime

radarr:
  radarr:
    base_url: http://radarr.media.svc.cluster.local:7878
    api_key: !env_var RADARR_API_KEY

    delete_old_custom_formats: true

    media_management:
      propers_and_repacks: do_not_prefer

    media_naming:
      folder: jellyfin-tmdb
      movie:
        rename: false
        standard: jellyfin-anime-tmdb

    quality_definition:
      type: sqp-uhd

    quality_profiles:
      - trash_id: &sqp 5128baeb2b081b72126bc8482b2a86a0 # [SQP] SQP-1 (2160p)
        reset_unmatched_scores:
          enabled: true
      - trash_id: &anime 722b624f9af1e492284c4bc842153a38 # [Anime] Remux-1080p
        reset_unmatched_scores:
          enabled: true

    # default groups (HDR, Unwanted SQP, Streaming, ...) are synced implicitly
    custom_format_groups:
      add:
        - trash_id: 15b1cf0b6f1a1493856a4355907affee # [Unwanted] Unwanted Formats SQP
          select:
            - 7357cf5161efbf8c4d5d0c30b4815ee2 # Obfuscated
            - 5c44f52a8714fdd79bb4d98e2673be1f # Retags
            - f537cf427b64c38c8e36298f657e4828 # Scene
        - trash_id: f4f1474b963b24cf983455743aa9906c # [Optional] Movie Versions
          select:
            - 957d0f44b592285f26449575e8b1167e # Special Edition

    custom_formats:
      - trash_ids: # only do a minor penalty, instead of the default major one
          - 839bea857ed2c0a8e084f3cbdbd65ecb # x265 (no HDR/DV)
        assign_scores_to:
          - trash_id: *sqp
            score: -100

      - trash_ids: # only do a minor penalty, instead of the default major one
          - cae4ca30163749b891686f95532519bd # AV1
        score: -200
        assign_scores_to:
          - trash_id: *sqp
          - trash_id: *anime
