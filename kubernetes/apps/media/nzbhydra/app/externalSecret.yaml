---
# yaml-language-server: $schema=https://schemas.mortebrume.eu/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nzbhydra
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        NZBHYDRA2__API_KEY: "{{ .INTERNAL_API_KEY }}"
  dataFrom:
    - extract:
        key: nzbhydra
