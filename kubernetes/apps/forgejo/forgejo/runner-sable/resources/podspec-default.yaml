---
containers:
  - env:
      - name: DEBIAN_FRONTEND
        value: noninteractive
      - name: CARGO_BUILD_JOBS
        value: "4"
      - name: MAKEFLAGS
        value: "-j4"
    image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04@sha256:b16190bb905d533ccc21b6762198ebc52366c3df23b3ab538270f8953c5973bc
    imagePullPolicy: IfNotPresent
    name: main
    resources:
      limits:
        cpu: "6"
        memory: 12Gi
      requests:
        cpu: "1"
        memory: 2Gi
restartPolicy: Never
