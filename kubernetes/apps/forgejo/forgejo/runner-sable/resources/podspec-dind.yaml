---
initContainers:
  - name: dind
    image: docker:29-dind
    args:
      - --ipv6
      - --fixed-cidr-v6=fd00:d1d::/64
    securityContext:
      privileged: true
    restartPolicy: Always
    env:
      - name: DOCKER_TLS_CERTDIR
        value: /certs
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: "4"
        memory: 8Gi
    volumeMounts:
      - name: docker-storage
        mountPath: /var/lib/docker
      - name: docker-certs
        mountPath: /certs
    startupProbe:
      exec:
        command:
          - sh
          - -c
          - docker --tlsverify --tlscacert=/certs/client/ca.pem --tlscert=/certs/client/cert.pem --tlskey=/certs/client/key.pem -H tcp://localhost:2376 info
      initialDelaySeconds: 5
      periodSeconds: 1
      failureThreshold: 30
containers:
  - env:
      - name: DEBIAN_FRONTEND
        value: noninteractive
      - name: DOCKER_HOST
        value: tcp://localhost:2376
      - name: DOCKER_TLS_VERIFY
        value: "1"
      - name: DOCKER_CERT_PATH
        value: /certs/client
      - name: CARGO_BUILD_JOBS
        value: "4"
      - name: MAKEFLAGS
        value: "-j4"
    image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04@sha256:d3f142f768c72e6f54443a07275889ee5b6c1e6560613be12a903744d6835c53
    imagePullPolicy: IfNotPresent
    name: main
    resources:
      limits:
        cpu: "6"
        memory: 12Gi
      requests:
        cpu: "1"
        memory: 2Gi
    volumeMounts:
      - name: docker-certs
        mountPath: /certs
        readOnly: true
volumes:
  - name: docker-storage
    emptyDir: {}
  - name: docker-certs
    emptyDir: {}
restartPolicy: Never
