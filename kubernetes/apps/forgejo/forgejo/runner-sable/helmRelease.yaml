---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-runner-sable
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo-runner-sable
  interval: 1h
  values:
    controllers:
      forgejo-runner-sable:
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            app.kubernetes.io/component: forgejo-runner-sable
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
        containers:
          k8s-plugin:
            image:
              repository: registry.erwanleboucher.dev/eleboucher/runner-k8s-plugin
              tag: 13.2.0
            args:
              - --listen
              - unix:///plugin/forgejo-runner-k8s.sock
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
          runner:
            image:
              repository: data.forgejo.org/forgejo/runner
              tag: 13.2.0
            command:
              - sh
              - -ec
              - |
                exec /bin/forgejo-runner daemon \
                --config /config/runner.yaml \
                --url "https://git.sable.moe" \
                --uuid "$(cat /etc/forgejo-runner-secret/uuid)" \
                --token-url file:///etc/forgejo-runner-secret/token
            resources:
              requests:
                cpu: 5m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    defaultPodOptions:
      automountServiceAccountToken: true
    persistence:
      config:
        type: configMap
        name: forgejo-runner-sable-config
        globalMounts:
          - path: /config
      plugin:
        type: emptyDir
      runner-secret:
        type: secret
        name: forgejo-runner-sable-secret
        globalMounts:
          - path: /etc/forgejo-runner-secret
            readOnly: true
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /data
            subPath: data
          - path: /tmp
            subPath: tmp
    rbac:
      bindings:
        forgejo-runner-sable:
          type: RoleBinding
          roleRef:
            identifier: forgejo-runner-sable
          subjects:
            - identifier: forgejo-runner-sable
      roles:
        forgejo-runner-sable:
          type: Role
          rules:
            - apiGroups:
                - "batch"
              resources:
                - jobs
              verbs:
                - create
                - delete
                - list
                - get
                - watch
            - apiGroups:
                - ""
              resources:
                - pods
              verbs:
                - get
                - list
                - watch
            - apiGroups:
                - ""
              resources:
                - pods/exec
              verbs:
                - create
                - get
            - apiGroups:
                - ""
              resources:
                - pods/log
              verbs:
                - get
                - list
                - watch
