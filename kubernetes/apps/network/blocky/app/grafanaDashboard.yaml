---
# yaml-language-server: $schema=https://schemas.mortebrume.eu/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: blocky
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - datasourceName: victoriametrics
      inputName: DS_PROMETHEUS
  envs:
    - name: VAR_BLOCKY_URL
      value: "http:\\/\\/blocky.network.svc.cluster.local"
  grafanaCom:
    id: 13768
