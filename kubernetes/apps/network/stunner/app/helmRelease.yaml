---
# yaml-language-server: $schema=https://schemas.mortebrume.eu/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stunner
spec:
  chartRef:
    kind: OCIRepository
    name: stunner
  interval: 1h
  values:
    standardCrds:
      enabled: false
    stunnerGatewayOperator:
      deployment:
        container:
          manager:
            resources:
              requests:
                cpu: 10m
                memory: 384Mi
              limits:
                cpu: 1000m
                memory: 512Mi
      dataplane:
        spec:
          enableMetricsEndpoint: true
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 2
              memory: 512Mi
