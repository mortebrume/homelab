---
# yaml-language-server: $schema=https://schemas.mortebrume.eu/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stunner
spec:
  chart:
    spec:
      chart: stunner
      version: 2.0.2
      sourceRef:
        kind: HelmRepository
        name: stunner
  interval: 1h
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: stunner-gateway-operator-controller-manager
            patch: |
              - op: replace
                path: /metadata/name
                value: stunner-operator
              - op: add
                path: /spec/strategy
                value:
                  type: RollingUpdate
                  rollingUpdate:
                    maxSurge: 0
                    maxUnavailable: 1
  values:
    standardCrds:
      enabled: false
    stunnerAuthService:
      enabled: false
    stunnerGatewayOperator:
      deployment:
        container:
          manager:
            resources:
              requests:
                cpu: 10m
                memory: 384Mi
              limits:
                cpu: 1000m
                memory: 512Mi
      dataplane:
        spec:
          enableMetricsEndpoint: true
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 2
              memory: 512Mi
