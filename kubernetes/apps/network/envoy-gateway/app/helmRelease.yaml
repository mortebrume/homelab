---
# yaml-language-server: $schema=https://schemas.mortebrume.eu/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  interval: 1h
  values:
    global:
      imageRegistry: mirror.gcr.io
    deployment:
      envoyGateway:
        resources:
          requests:
            cpu: 10m
            memory: 448Mi
          limits:
            memory: 1Gi
    config:
      envoyGateway:
        extensionApis:
          enableLua: true
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              type: GatewayNamespace
