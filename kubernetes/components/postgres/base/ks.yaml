---
# yaml-language-server: $schema=https://schemas.mortebrume.eu/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ${APP}-db
  namespace: &namespace database
spec:
  dependsOn:
    - name: cnpg
      namespace: cnpg-system
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      current: has(status.applied) && status.applied
    - apiVersion: postgresql.cnpg.io/v1
      kind: DatabaseRole
      current: has(status.applied) && status.applied
  interval: 1h
  path: ./kubernetes/components/postgres/base/database
  postBuild:
    substitute:
      APP: ${APP}
      OWNER: ${DATABASE_OWNER:=${APP}}
      SCHEMAS: ${q:='}${DATABASE_SCHEMAS:=}${q:='}
      EXTENSIONS: ${q:='}${DATABASE_EXTENSIONS:=}${q:='}
      emptyArray: "[]"
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
