---
# yaml-language-server: $schema=https://schemas.mortebrume.eu/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: &app ${APP}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: *app
  oidc:
    provider:
      issuer: "https://idm.mortebrume.eu/oauth2/openid/${APP}"
      # avoid discovery through this gateway during Kanidm TLS-secret rollouts
      authorizationEndpoint: "https://idm.mortebrume.eu/ui/oauth2"
      tokenEndpoint: "https://idm.mortebrume.eu/oauth2/token"
    clientID: *app
    clientSecret:
      name: "kanidm-${APP}-oidc"
    redirectURL: "https://${SUBDOMAIN:=${APP}}.mortebrume.eu/oauth2/callback"
    logoutPath: "/logout"
    # non-navigation requests get a 401 instead of an OIDC redirect
    denyRedirect:
      headers:
        - name: Sec-Fetch-Mode
          type: RegularExpression
          value: "^(cors|no-cors|same-origin|websocket)$"
